<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerario · Mallorca Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f0f4f8;
            color: #333;
        }

        /* ── Carousel ── */
        .carousel {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            overflow: hidden;
            background: #111;
        }

        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.35s ease;
        }

        .carousel-slide {
            min-width: 100%;
            height: 100%;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.45);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-btn.prev { left: 10px; }
        .carousel-btn.next { right: 10px; }

        .carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: background 0.2s;
        }
        .dot.active { background: white; }

        /* ── Counter ── */
        .carousel-counter {
            position: absolute;
            top: 10px;
            right: 12px;
            background: rgba(0,0,0,0.45);
            color: white;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 12px;
        }

        /* ── Content ── */
        .content {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .title-block { padding: 16px 0 4px; }
        .title-block h1 { font-size: 1.3rem; font-weight: 700; line-height: 1.3; }
        .title-block h2 { font-size: 0.95rem; color: #555; font-weight: 400; margin-top: 4px; }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
        }
        .tag {
            background: #e8f4fd;
            color: #0077b6;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 16px 0;
        }
        .stat {
            background: white;
            border-radius: 10px;
            padding: 12px 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .stat .label { font-size: 0.72rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat .value { font-size: 1rem; font-weight: 600; margin-top: 2px; }

        .description {
            background: white;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            margin: 16px 0;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #444;
        }

        .highlights {
            background: white;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            margin: 16px 0;
        }
        .highlights h3 {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }
        .highlights ul {
            list-style: none;
            padding: 0;
        }
        .highlights li {
            padding: 6px 0;
            font-size: 0.92rem;
            line-height: 1.5;
        }
        .highlights li:before {
            content: "✓ ";
            color: #00bf63;
            font-weight: bold;
            margin-right: 8px;
        }

        hr { border: none; border-top: 1px solid #e0e0e0; margin: 20px 0; }

        .cta { text-align: center; padding: 10px 0; }
        .cta p { color: #555; margin-bottom: 14px; font-size: 0.95rem; }

        .btn {
            display: inline-block;
            padding: 13px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            margin: 5px;
        }
        .btn-primary { background: #00bf63; color: white; }
        .btn-secondary { background: #1a1a2e; color: white; }

        .note {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
        }

        .error {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            background: white;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .error h2 { color: #d63031; margin-bottom: 10px; }

        .loading {
            max-width: 600px;
            margin: 40px auto;
            padding: 40px;
            text-align: center;
            color: #888;
        }

        /* ── Map ── */
        .map-section { margin: 16px 0; }
        .map-section h3 { font-size: 0.85rem; color: #888; text-transform: uppercase;
            letter-spacing: 0.05em; margin-bottom: 10px; }
        #map {
            width: 100%;
            height: 260px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .stop-label {
            background: white;
            border: 2px solid #0077b6;
            border-radius: 6px;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: 600;
            color: #0077b6;
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="loading">Cargando itinerario...</div>
    </div>

    <script>
        // Get itineraryId from URL parameter
        const params = new URLSearchParams(window.location.search);
        const itineraryId = params.get('itineraryId');

        if (!itineraryId) {
            document.getElementById('app').innerHTML = `
                <div class="error">
                    <h2>⚠️ Itinerario no especificado</h2>
                    <p>Falta el parámetro <code>itineraryId</code> en la URL.</p>
                </div>
            `;
        } else {
            loadItinerary(itineraryId);
        }

        async function loadItinerary(id) {
            try {
                const response = await fetch('../seed_data.json');
                const data = await response.json();

                const itinerary = data.itineraries.find(i => i.id === id);

                if (!itinerary) {
                    document.getElementById('app').innerHTML = `
                        <div class="error">
                            <h2>❌ Itinerario no encontrado</h2>
                            <p>No se encontró el itinerario con ID: <strong>${id}</strong></p>
                        </div>
                    `;
                    return;
                }

                renderItinerary(itinerary);
            } catch (error) {
                document.getElementById('app').innerHTML = `
                    <div class="error">
                        <h2>❌ Error al cargar</h2>
                        <p>No se pudo cargar el itinerario. Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        function renderItinerary(itin) {
            document.title = `${itin.title} · Mallorca Explorer`;

            // Helper: normalize asset URL for web
            function assetUrl(url) {
                if (!url) return null;
                return url
                    .replace('asset://', '../images/')
                    .replace('file:///android_asset/images/', '../images/');
            }

            // Build photo URLs
            const photos = [];
            // Support both cover_photo_url (old) and cover (new seed format)
            const coverSrc = itin.cover_photo_url || itin.cover;
            if (coverSrc) photos.push(assetUrl(coverSrc));

            // Support both gallery_photos_json (old) and gallery array (new seed format)
            if (itin.gallery_photos_json) {
                try {
                    const gallery = JSON.parse(itin.gallery_photos_json);
                    gallery.forEach(item => {
                        const u = assetUrl(typeof item === 'string' ? item : item.url);
                        if (u) photos.push(u);
                    });
                } catch (e) {
                    console.error('Error parsing gallery photos:', e);
                }
            } else if (Array.isArray(itin.gallery)) {
                itin.gallery.forEach(item => {
                    const u = assetUrl(typeof item === 'string' ? item : item.url);
                    if (u) photos.push(u);
                });
            }

            // Build tags
            const tags = [];
            if (itin.category) tags.push(getCategoryEmoji(itin.category) + ' ' + itin.category);
            if (itin.tags_json) {
                try {
                    const tagList = JSON.parse(itin.tags_json);
                    tagList.forEach(t => tags.push(t));
                } catch (e) {}
            } else if (Array.isArray(itin.tags)) {
                itin.tags.forEach(t => tags.push(t));
            }

            // Build highlights
            let highlightsHTML = '';
            const highlightsSrc = itin.highlights_json
                ? JSON.parse(itin.highlights_json)
                : (Array.isArray(itin.highlights) ? itin.highlights : []);
            if (highlightsSrc.length > 0) {
                highlightsHTML = `
                    <div class="highlights">
                        <h3>Lo destacado</h3>
                        <ul>
                            ${highlightsSrc.map(h => `<li>${h}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            // Build waypoints for map
            // Support route_waypoints (old) and route_polyline_points (new seed format)
            const waypoints = [];
            const wpSource = itin.route_waypoints || itin.route_polyline_points;
            if (wpSource) {
                try {
                    const wpList = typeof wpSource === 'string' ? JSON.parse(wpSource) : wpSource;
                    wpList.forEach((wp, i) => {
                        waypoints.push({
                            name: wp.name_es || wp.name || `Punto ${i + 1}`,
                            lat: wp.lat,
                            lng: wp.lng || wp.lon,
                            order: wp.order !== undefined ? wp.order : i
                        });
                    });
                    waypoints.sort((a, b) => a.order - b.order);
                } catch (e) {
                    console.error('Error parsing waypoints:', e);
                }
            }

            const difficulty = itin.difficulty || 'Media';
            const distance = itin.total_distance_km ? `${itin.total_distance_km} km` : 'N/A';
            const duration = itin.duration_days ? `${itin.duration_days} día${itin.duration_days > 1 ? 's' : ''}` : 'Medio día';

            // Render HTML
            document.getElementById('app').innerHTML = `
                <!-- Carousel -->
                <div class="carousel" id="carousel">
                    <div class="carousel-track" id="track"></div>
                    ${photos.length > 1 ? `
                        <button class="carousel-btn prev" id="prev">&#8249;</button>
                        <button class="carousel-btn next" id="next">&#8250;</button>
                        <div class="carousel-dots" id="dots"></div>
                    ` : ''}
                    ${photos.length > 1 ? '<div class="carousel-counter" id="counter"></div>' : ''}
                </div>

                <!-- Content -->
                <div class="content">
                    <div class="title-block">
                        <h1>${itin.title}</h1>
                        <h2>${itin.description}</h2>
                    </div>

                    ${tags.length > 0 ? `
                        <div class="tags">
                            ${tags.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                    ` : ''}

                    <div class="stats">
                        <div class="stat">
                            <div class="label">Distancia</div>
                            <div class="value">${distance}</div>
                        </div>
                        <div class="stat">
                            <div class="label">Duración</div>
                            <div class="value">${duration}</div>
                        </div>
                        <div class="stat">
                            <div class="label">Dificultad</div>
                            <div class="value">${getDifficultyEmoji(difficulty)} ${difficulty}</div>
                        </div>
                        <div class="stat">
                            <div class="label">Paradas</div>
                            <div class="value">${waypoints.length > 0 ? waypoints.length : 'Varias'}</div>
                        </div>
                    </div>

                    ${highlightsHTML}

                    ${waypoints.length > 0 ? `
                        <div class="map-section">
                            <h3>Recorrido de la ruta</h3>
                            <div id="map"></div>
                        </div>
                    ` : ''}

                    <hr>

                    <div class="cta">
                        <p><strong>Abre esta ruta en Mallorca Explorer</strong></p>
                        <a href="https://play.google.com/store/apps/details?id=com.mallorca.explorer" class="btn btn-primary">Descargar en Google Play</a>
                        <a href="mallorca://itinerary?itineraryId=${itin.id}" class="btn btn-secondary">Abrir en la app</a>
                        <p class="note">Mallorca Explorer · Solo disponible para Android</p>
                    </div>
                </div>
            `;

            // Initialize carousel
            if (photos.length > 0) {
                initCarousel(photos);
            }

            // Initialize map
            if (waypoints.length > 0) {
                setTimeout(() => initMap(waypoints), 100);
            }
        }

        function initCarousel(photos) {
            const track = document.getElementById('track');
            const dotsEl = document.getElementById('dots');
            const counter = document.getElementById('counter');
            let current = 0;

            // Build slides
            photos.forEach((src, i) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                const img = document.createElement('img');
                img.src = src;
                img.alt = `Foto ${i + 1}`;
                img.loading = i === 0 ? 'eager' : 'lazy';
                slide.appendChild(img);
                track.appendChild(slide);

                if (photos.length > 1 && dotsEl) {
                    const dot = document.createElement('div');
                    dot.className = 'dot' + (i === 0 ? ' active' : '');
                    dot.addEventListener('click', () => goTo(i));
                    dotsEl.appendChild(dot);
                }
            });

            function updateUI() {
                track.style.transform = `translateX(-${current * 100}%)`;
                if (dotsEl) {
                    document.querySelectorAll('.dot').forEach((d, i) =>
                        d.classList.toggle('active', i === current));
                }
                if (counter) {
                    counter.textContent = `${current + 1} / ${photos.length}`;
                }
            }

            function goTo(n) {
                current = (n + photos.length) % photos.length;
                updateUI();
            }

            const prevBtn = document.getElementById('prev');
            const nextBtn = document.getElementById('next');
            if (prevBtn) prevBtn.addEventListener('click', () => goTo(current - 1));
            if (nextBtn) nextBtn.addEventListener('click', () => goTo(current + 1));

            // Swipe
            let startX = 0;
            const carousel = document.getElementById('carousel');
            carousel.addEventListener('touchstart', e => startX = e.touches[0].clientX, { passive: true });
            carousel.addEventListener('touchend', e => {
                const dx = e.changedTouches[0].clientX - startX;
                if (Math.abs(dx) > 40) goTo(current + (dx < 0 ? 1 : -1));
            });

            updateUI();
        }

        function initMap(waypoints) {
            const mapEl = document.getElementById('map');
            if (!mapEl) return;

            const map = L.map('map', { zoomControl: true, scrollWheelZoom: false });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 17
            }).addTo(map);

            const latlngs = waypoints.map(w => [w.lat, w.lng]);
            L.polyline(latlngs, { color: '#FF8C00', weight: 3.5, opacity: 0.9 }).addTo(map);

            waypoints.forEach((w, i) => {
                const icon = L.divIcon({
                    className: '',
                    html: `<div style="background:#FF8C00;color:white;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.3)">${i + 1}</div>`,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12],
                });
                L.marker([w.lat, w.lng], { icon })
                    .addTo(map)
                    .bindTooltip(w.name, { permanent: false, direction: 'top', className: 'stop-label' });
            });

            map.fitBounds(L.latLngBounds(latlngs), { padding: [30, 30] });
        }

        function getCategoryEmoji(category) {
            const map = {
                'SUP': '🏄',
                'HIKING': '🥾',
                'BEACH': '🏖️',
                'CULTURE': '🏛️',
                'FOOD': '🍴',
                'NATURE': '🌿'
            };
            return map[category] || '📍';
        }

        function getDifficultyEmoji(difficulty) {
            const map = {
                'EASY': '🟢',
                'Fácil': '🟢',
                'MODERATE': '🟡',
                'Media': '🟡',
                'HARD': '🔴',
                'Difícil': '🔴'
            };
            return map[difficulty] || '🟡';
        }
    </script>

</body>
</html>
